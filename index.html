      const old=byCredit.get(String(seed.credit||''));
      if(!old)return {...seed};
      const item={...seed,...old};
      Object.keys(seed).forEach(k=>{if(item[k]===undefined||item[k]===null||item[k]==='')item[k]=seed[k];});
      return item;
    });
    (Array.isArray(saved)?saved:[]).forEach(c=>{if(!seedKeys.has(String(c.credit||'')))merged.push(c);});
    return merged;
  };
  try{
    const x=JSON.parse(localStorage.getItem(STORE)||'null');
    if(x&&Array.isArray(x.clients)){
      db={...db,...x}; db.clients=mergeSeed(x.clients);
      if(!Array.isArray(db.employees))db.employees=[];
      if(!Array.isArray(db.movements))db.movements=[];
      save();
    }else{db.clients=initialClients.map(c=>({...c}));save();}
  }catch(e){db.clients=initialClients.map(c=>({...c}));save();}
}

let pendingEmployeePhoto='';function previewEmployeePhoto(ev){let f=ev.target.files?.[0];if(!f)return;if(f.size>10*1024*1024){toast('La imagen es demasiado grande');ev.target.value='';return}let im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{let cv=document.createElement('canvas'),scale=Math.min(1,700/Math.max(im.width,im.height));cv.width=im.width*scale;cv.height=im.height*scale;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);pendingEmployeePhoto=cv.toDataURL('image/jpeg',.78);document.getElementById('employeePhotoPreview').src=pendingEmployeePhoto;URL.revokeObjectURL(url)};im.src=url}function saveEmployee(ev,i){ev.preventDefault();let o=Object.fromEntries(new FormData(ev.target));o.active=o.active==='true';let old=i>=0?db.employees[i]:{};o.uid=old.uid||o.uid||makeUid();o.photo=pendingEmployeePhoto||(old.photo||'');o.fingerId=old.fingerId||'';pendingEmployeePhoto='';if(i>=0)db.employees[i]={...old,...o};else db.employees.push(o);save();closeModal();renderAll();toast('Empleado guardado')};function deleteEmployee(i){if(confirm('¿Eliminar este registro de empleado?')){db.employees.splice(i,1);save();renderEmployees()}}
function renderMovements(){let q=(document.getElementById('movSearch')?.value||'').toLowerCase();let arr=db.movements.filter(m=>(m.clientName+' '+m.type+' '+m.note+' '+m.date).toLowerCase().includes(q));document.getElementById('page-movements').innerHTML=`<div class=\"headrow\"><div><h1>Movimientos y cobranza</h1><div class=\"muted\">Registra pagos, desembolsos y otras operaciones.</div></div><div class=\"actions noprint\"><button class=\"secondary\" onclick=\"printPage('Registro de movimientos')\">Imprimir / guardar PDF</button><button class=\"primary\" onclick=\"openMovement()\">＋ Registrar movimiento</button></div></div><div class=\"toolbar noprint\"><input id=\"movSearch\" class=\"search\" placeholder=\"Buscar cliente, tipo, fecha…\" value=\"${esc(q)}\" oninput=\"renderMovements()\"><select class=\"search\" style=\"max-width:210px\" id=\"movTypeFilter\" onchange=\"applyMovementFilter(this.value)\"><option value=\"\">Todos los movimientos</option><option>Pago</option><option>Desembolso</option><option>Otro</option></select></div><div class=\"cards\"><div class=\"card\"><div class=\"kicker\">Movimientos registrados</div><div class=\"metric\">${arr.length}</div></div><div class=\"card\"><div class=\"kicker\">Pagos registrados</div><div class=\"metric\">${money(arr.filter(m=>m.type==='Pago').reduce((s,m)=>s+Number(m.amount||0),0))}</div></div><div class=\"card\"><div class=\"kicker\">Desembolsos registrados</div><div class=\"metric\">${money(arr.filter(m=>m.type==='Desembolso').reduce((s,m)=>s+Number(m.amount||0),0))}</div></div><div class=\"card\"><div class=\"kicker\">Otros movimientos</div><div class=\"metric\">${arr.filter(m=>m.type==='Otro').length}</div></div></div><div class=\"tablewrap\"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Tipo</th><th>Importe</th><th>Medio / referencia</th><th>Observaciones</th><th class=\"noprint\">Acciones</th></tr></thead><tbody>${arr.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.clientName)}</td><td>${esc(m.type)}</td>< function saveMovement(ev){ev.preventDefault();let o=Object.fromEntries(new FormData(ev.target)),c=db.clients.find(c=>c.credit===o.credit);o.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);o.clientName=c?.name||'';o.amount=Number(o.amount||0);db.movements.push(o);save();closeModal();renderMovements();toast('Movimiento guardado')};function deleteMovement(id){if(confirm('¿Eliminar este movimiento?')){db.movements=db.movements.filter(m=>m.id!==id);save();renderMovements()}}
function renderReports(){let c=statusCounts(),total=db.clients.length,pay=db.movements.filter(m=>m.type==='Pago').reduce((s,m)=>s+Number(m.amount||0),0),dis=db.movements.filter(m=>m.type==='Desembolso').reduce((s,m)=>s+Number(m.amount||0),0);let zones={};db.clients.forEach(x=>{let z=x.zone||'Zona no especificada';zones[z]=(zones[z]||0)+1});document.getElementById('page-reports').innerHTML=`<div class=\"headrow\"><div><h1>Estadísticas e informes</h1><div class=\"muted\">Distribución de cartera y movimientos registrados.</div></div><button class=\"primary noprint\" onclick=\"printPage('Informe estadístico CRECER++')\">Imprimir / guardar PDF</button></div><div class=\"cards\"><div class=\"card\"><div class=\"kicker\">Total clientes</div><div class=\"metric\">${total}</div></div><div class=\"card\"><div class=\"kicker\">Pagos ingresados</div><div class=\"metric\">${money(pay)}</div><div class=\"metricnote\">Solo movimientos registrados aquí</div></div><div class=\"card\"><div class=\"kicker\">Desembolsos ingresados</div><div class=\"metric\">${money(dis)}</div></div><div class=\"card\"><div class=\"kicker\">Empleados</div><div class=\"metric\">${db.employees.length}</div></div></div><div class=\"grid2\"><div class=\"panel\"><h2>Clientes por estado</h2><canvas id=\"chartStatus\" width=\"450\" height=\"250\" style=\"width:100%;max-height:280px\"></canvas></div><div class=\"panel\"><h2>Clientes por zona</h2><canvas id=\"chartZones\" width=\"450\" height=\"250\" style=\"width:100%;max-height:280px\"></canvas></div></div><div class=\"panel\" style=\"margin-top:16px\"><h2>Resumen por zona</h2><div class=\"tablewrap\"><table><thead><tr><th>Zona</th><th>Clientes</th><th>Participación</th></tr></thead><tbody>${Object.entries(zones).sort((a,b)=>b[1]-a[1]).map(([z,n])=>`<tr><td>${esc(z)}</td><td>${n}</td><td>${total?(n/total*100).toFixed(1):0}%</td></tr>`).join('')}</tbody></table></div></div><div class=\"notice warn\" style=\"margin-top:16px\">Los importes estadísticos reflejan ú function drawCharts(c,zones){setTimeout(()=>{drawBar('chartStatus',c.map(x=>x.s),c.map(x=>x.n));drawBar('chartZones',Object.entries(zones).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]),Object.entries(zones).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[1]))},20)}function drawBar(id,labels,values){let cv=document.getElementById(id);if(!cv)return;let ctx=cv.getContext('2d'),w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);let max=Math.max(1,...values),left=130,top=18,bh=Math.min(38,(h-40)/Math.max(1,labels.length));ctx.font='12px Segoe UI,Arial';labels.forEach((l,i)=>{let y=top+i*bh;ctx.fillStyle='#52675b';ctx.fillText(String(l).slice(0,18),6,y+bh*.65);ctx.fillStyle='#eaf1ec';ctx.fillRect(left,y,w-left-30,bh*.48);ctx.fillStyle=['#d9a43d','#648ce0','#38a66a','#13885a','#8f73c9','#e18461'][i%6];ctx.fillRect(left,y,(w-left-30)*values[i]/max,bh*.48);ctx.fillStyle='#1c2d27';ctx.fillText(values[i],left+(w-left-30)*values[i]/max+5,y+bh*.65)})}
function makeUid(){return 'emp-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function renderBiometric(){db.employees.forEach(e=>{if(!e.uid)e.uid=makeUid()});save();document.getElementById('page-biometric').innerHTML=`<div class="headrow"><div><h1>Identificación biométrica</h1><div class="muted">Registro e identificación de clientes y empleados</div></div></div><div class="panel"><h2>Conexión del lector</h2><div class="finger"><span><i id="serialDot" class="statusdot"></i><b id="serialStatus">Desconectado</b></span><button class="primary" onclick="connectSerial()">Conectar Arduino por USB</button><button class="secondary" onclick="checkSerialSupport()">Comprobar celular</button><button class="secondary" onclick="disconnectSerial()">Desconectar</button></div><div class="formgrid" style="margin-top:18px"><div class="field"><label>Tipo de persona</label><select id="fingerKind" onchange="refreshFingerPeople()"><option value="client">Cliente</option><option value="employee">Empleado</option></select></div><div class="field"><label>Persona</label><select id="fingerClient"></select></div></div><div class="actions"><button class="primary" onclick="sendFinger('1')">Registrar huella</button><button class="secondary" onclick="sendFinger('2')">Identificar persona</button></div><div id="fingerLog" class="notice" style="display:block;margin-top:16px">Lector desconectado</div></div><div class="panel" style="margin-top:16px"><h2>Huellas registradas</h2><div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Nombre</th><th>Referencia</th><th>Cargo / zona</th><th>ID biométrico</th><th></th></tr></thead><tbody>${db.clients.filter(c=>c.fingerId).map(c=>`<tr><td>Cliente</td><td>${esc(c.name)}</td><td>${esc(c.credit)}</td><td>${esc(c.zone||'')}</td><td>${esc(c.fingerId)}</td><td><button class="secondary small" onclick="selectFingerClient('client:${esc(c.credit)}')">Seleccionar</button></td></tr>`).join('')}${db.employees.filter(e=>e.fingerId).map(e=>`<tr><td>Empleado</td><td>${esc(e.name)}</td><td>${esc(e.ci||e.user||e.uid)}</td><td>${esc(e.role||'')}</td><td>${esc(e.fingerId)}</td><td><button class="secondary small" onclick="selectFingerClient('employee:${esc(e.uid)}')">Seleccionar</button></td></tr>`).join('')||''}${!db.clients.some(c=>c.fingerId)&&!db.employees.some(e=>e.fingerId)?'<tr><td colspan="6" class="empty">No hay huellas registradas.</td></tr>':''}</tbody></table></div></div>`;refreshFingerPeople()}
let fingerMode='';function checkSerialSupport(){let secure=window.isSecureContext;let api=('serial' in navigator);let msg='Diagnóstico del navegador: '+(api?'API Serial disponible. ':'API Serial no disponible. ')+(secure?'Contexto seguro (HTTPS/localhost). ':'La página debe abrirse desde un enlace HTTPS para autorizar el dispositivo. ');if(!api)msg+='Actualiza Chrome y comprueba si tu versión Android permite USB Serial; que Android reconozca el Arduino no garantiza que el navegador pueda acceder al puerto.';else msg+='Pulsa Conectar Arduino por USB y elige el puerto que corresponda al Arduino.';logFinger(msg)}async function connectSerial(){if(!window.isSecureContext){logFinger('Para conectar el Arduino desde el navegador, abre CRECER++ desde un enlace HTTPS seguro. Un archivo descargado puede no tener permisos de puerto serial.');return}if(!('serial' in navigator)){logFinger('Este navegador no expone Web Serial. Android puede reconocer el Arduino y aun así no permitir que la página use el puerto. Actualiza Chrome; si sigue igual, necesitaremos un puente local/app compatible.');return}try{serialPort=await navigator.serial.requestPort();await serialPort.open({baudRate:9600});document.getElementById('serialStatus').textContent='Conectado';document.getElementById('serialDot').classList.add('on');logFinger('Lector conectado.');readSerial()}catch(e){logFinger('No se pudo conectar: '+e.message)}}async function readSerial(){try{const decoder=new TextDecoderStream();serialPort.readable.pipeTo(decoder.writable);serialReader=decoder.readable.getReader();while(true){let {value,done}=await serialReader.read();if(done)break;serialBuffer+=value;let lines=serialBuffer.split(/\r?\n/);serialBuffer=lines.pop();for(let l of lines){l=l.trim();if(!l)continue;logFinger(l);let m=l.match(/ID\s*:\s*(\d+)/i);if(m){let id=m[1];if(fingerMode==='register'){let val=document.getElementById('fingerClient')?.value||'', [kind,...parts]=val.split(':'), key=parts.join(':');if(kind==='employee'){let e=db.employees.find(x=>x.uid===key);if(e){e.fingerId=id;save();renderBiometric();logFinger('Huella registrada: '+e.name+' · ID '+id)}else logFinger('Selecciona un empleado válido antes de registrar.')}else{let c=db.clients.find(x=>x.credit===key);if(c){c.fingerId=id;save();renderBiometric();logFinger('Huella registrada: '+c.name+' · ID '+id)}else logFinger('Selecciona un cliente válido antes de registrar.')}}else if(fingerMode==='identify'){let foundC=db.clients.find(x=>String(x.fingerId)===String(id)),foundE=db.employees.find(x=>String(x.fingerId)===String(id));if(foundC)logFinger('IDENTIFICADO · CLIENTE: '+foundC.name+' · Crédito '+foundC.credit+' · Zona '+(foundC.zone||'No registrada'));else if(foundE)logFinger('IDENTIFICADO · EMPLEADO: '+foundE.name+' · Cargo '+(foundE.role||'No registrado'));else logFinger('El lector reconoció el ID '+id+', pero no está asociado a un cliente o empleado. Registra primero su huella.')}}}}}catch(e){if(serialPort)logFinger('Lectura serial finalizada.')}}async function sendFinger(cmd){if(!serialPort){toast('Conecta primero el lector');return}try{fingerMode=cmd==='1'?'register':'identify';let w=serialPort.writable.getWriter();await w.write(new TextEncoder().encode(cmd));w.releaseLock();logFinger(cmd==='1'?'REGISTRO: coloca el dedo siguiendo el procedimiento del lector.':'BÚSQUEDA: coloca el dedo para identificar a la persona.')}catch(e){logFinger('No se pudo enviar la orden: '+e.message)}}async function disconnectSerial(){try{if(serialReader){await serialReader.cancel();serialReader.releaseLock()}if(serialPort)await serialPort.close()}catch(e){}serialPort=null;serialReader=null;document.getElementById('serialStatus').textContent='Desconectado';document.getElementById('serialDot').classList.remove('on');logFinger('Lector desconectado.')}function logFinger(t){let e=document.getElementById('fingerLog');if(e)e.textContent=t}function selectFingerClient(id){go('biometric');let s=document.getElementById('fingerClient');if(!s)return;let parts=id.split(':');document.getElementById('fingerKind').value=parts[0]||'client';refreshFingerPeople();s.value=id}function refreshFingerPeople(){let kind=document.getElementById('fingerKind')?.value||'client',s=document.getElementById('fingerClient');if(!s)return;let items=kind==='employee'?db.employees.map(e=>({value:'employee:'+e.uid,label:e.name+' — '+(e.role||'Sin cargo')})):db.clients.map(c=>({value:'client:'+c.credit,label:c.name+' — '+c.credit}));s.innerHTML=items.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('');if(!items.length)s.innerHTML='<option value="">No hay personas registradas</option>'}
function makeUid(){return 'emp-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}

function changePassword(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));if(f.current!==db.password){toast('La contraseña actual no coincide');return}if(f.next!==f.confirm){toast('Las contraseñas nuevas no coinciden');return}db.password=f.next;save();ev.target.reset();toast('Contraseña actualizada')}

function restoreBackup(ev){let f=ev.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.db||!Array.isArray(x.db.clients)||!Array.isArray(x.db.employees))throw Error();if(!confirm('La restauración reemplazará los datos actuales. ¿Continuar?'))return;db={...db,...x.db};save();renderAll();toast('Copia restaurada')}catch(e){toast('No se pudo restaurar la copia')}};r.readAsText(f);ev.target.value=''}
function exportCSV(){let keys=['credit','number','code','name','status','zone','address','map','businessAddress','defaultDate','commitDate','dueDate','principal','interestRate','installment','graceDays','fingerId','observations'];let csv=[keys.join(','),...db.clients.map(c=>keys.map(k=>'"'+String(c[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='CRECERPlus_clientes_'+today()+'.csv';a.click();URL.revokeObjectURL(u)}
function importCSV(ev){let f=ev.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let rows=parseCSV(String(r.result).replace(/^\ufeff/,''));if(rows.length<2)throw Error();let keys=rows.shift().map(x=>x.trim());let list=rows.filter(row=>row.some(v=>v.trim())).map(row=>{let o={};keys.forEach((k,i)=>o[k]=row[i]??'');o.credit=String(o.credit||'').trim();o.name=String(o.name||'').trim();if(!['PENDIENTE','COMPROMISO','CANCELADO'].includes(o.status))o.status='PENDIENTE';return o}).filter(o=>o.credit&&o.name);let m=new Map(db.clients.map(c=>[String(c.credit),c]));list.forEach(c=>m.set(String(c.credit),{...(m.get(String(c.credit))||{}),...c}));db.clients=[...m.values()];save();renderAll();toast('Registros importados: '+list.length)}catch(e){toast('No se pudo importar. Revisa el formato CSV.')}};r.readAsText(f);ev.target.value=''}
function parseCSV(t){let rows=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'&&q&&t[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);rows.push(row);row=[];v=''}else v+=c}if(v.length||row.length){row.push(v);rows.push(row)}return rows}
function registerVisit(credit){let c=db.clients.find(x=>x.credit===credit);if(!c)return;let date=prompt('Fecha de visita (AAAA-MM-DD):',today());if(!date)return;let result=prompt('Resultado de la visita (contactado, ausente, compromiso, pago u otro):','contactado')||'';let note=prompt('Observaciones de la visita:','')||'';c.visits=c.visits||[];c.visits.push({date,result,note,employee:''});save();closeModal();renderAll();toast('Visita registrada')}
